# Continuous integration: both packages' test suites plus the switch-constant
# guard (the certified far-tail thresholds are duplicated at four sites; CI
# fails if they drift apart).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: python -m pip install -e "voigtinference[test]"
      - name: Run tests
        run: python -m pytest voigtinference/tests -q

  julia:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: VoigtInference.jl
      - uses: julia-actions/julia-runtest@v1
        with:
          project: VoigtInference.jl

  constants-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Far-tail switch constants agree at all four sites
        run: python check_constants.py

# Continuous integration: both packages' test suites plus the switch-constant
# guard (the certified far-tail thresholds are duplicated at four sites; CI
# fails if they drift apart).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: python -m pip install -e "voigtinference[test]"
      - name: Run tests
        run: python -m pytest voigtinference/tests -q

  python-integrations:
    # exercises the advertised optional integrations (lmfit) so their tests
    # cannot be silently skipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with test and examples extras
        run: python -m pip install -e "voigtinference[test,examples]"
      - name: Run tests (lmfit integration exercised, not skipped)
        run: python -m pytest voigtinference/tests -q

  julia:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: VoigtInference.jl
      - uses: julia-actions/julia-runtest@v1
        with:
          project: VoigtInference.jl

  cross-language:
    # enforces the README's cross-validation claim: the Python and Julia
    # implementations must agree within 1e-12 on the shared grid, and the
    # MLE paths must cross-check at the three reference theta cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Install Python package
        run: python -m pip install -e voigtinference
      - name: Instantiate Julia package
        run: julia --project=VoigtInference.jl -e 'using Pkg; Pkg.instantiate()'
      - name: Cross-language check (1e-12 tolerance)
        run: bash voigtinference/bench/run_bench.sh --cross

  constants-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Far-tail switch constants agree at all guarded sites
        run: python check_constants.py

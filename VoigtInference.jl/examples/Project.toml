# Environment for the example scripts that need plotting (figures.jl,
# raman.jl). The package itself depends only on SpecialFunctions; Plots is
# deliberately kept out of the main Project.toml. Activate with
#   julia --project=examples
# after dev-ing the package into it once:
#   julia --project=examples -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
[deps]
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
VoigtInference = "70c6e13a-0f62-4545-a8b0-5ece11b769b1"
